<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Rounded candles series Plugin Example</title>
		<style>html,body{color:#131722;background-color:#f8f9fd;height:100%;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Trebuchet MS,Roboto,Ubuntu,sans-serif;overflow:hidden}body{flex-direction:column;display:flex}#controls{flex-wrap:wrap;align-items:center;gap:16px;padding:8px 12px;font-size:13px;display:flex}#chart{flex:auto;min-height:0}</style>
		<script type="module" crossorigin src="./assets/main-BFyz5Kgq.js"></script>
	</head>
	<body>
		<div id="controls">
			<label>
				Radius
				<select id="radius">
					<option value="auto">Auto (bar spacing)</option>
					<option value="0">0 — square</option>
					<option value="4">4</option>
					<option value="10">10</option>
				</select>
			</label>
			<label>
				Wicks
				<select id="wick">
					<option value="butt">Square ends</option>
					<option value="round">Round ends</option>
					<option value="hidden">Hidden</option>
				</select>
			</label>
			<label>
				Borders
				<select id="border">
					<option value="matching">Matching the body</option>
					<option value="contrast">Contrasting</option>
					<option value="none">None</option>
				</select>
			</label>
		</div>
		<div id="chart"></div>
	</body>
</html>
