<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Pretty histogram series Plugin Example</title>
		<style>html,body{color:#131722;background-color:#f8f9fd;height:100%;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}body{flex-direction:column;display:flex}#controls{flex-wrap:wrap;align-items:center;gap:16px;padding:8px 12px;font-size:13px;display:flex}#controls label{align-items:center;gap:6px;display:flex}#chart{flex:auto;min-height:0}</style>
		<script type="module" crossorigin src="./assets/main-CEsfasdl.js"></script>
	</head>
	<body>
		<div id="controls">
			<label>
				Radius
				<input id="radius" type="range" min="0" max="12" step="1" value="4" />
				<output id="radius-value">4</output>
			</label>
			<label>
				Width %
				<input id="width" type="range" min="10" max="100" step="5" value="50" />
				<output id="width-value">50</output>
			</label>
			<label>
				Up color
				<input id="up-color" type="color" value="#089981" />
			</label>
			<label>
				Down color
				<input id="down-color" type="color" value="#f23645" />
			</label>
			<label>
				<input id="two-tone" type="checkbox" checked />
				Two-tone by sign
			</label>
		</div>
		<div id="chart"></div>
	</body>
</html>
