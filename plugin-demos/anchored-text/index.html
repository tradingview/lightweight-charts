<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Anchored text Plugin Example</title>
		<style>html,body{color:#131722;background-color:#f8f9fd;height:100%;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;font-size:14px;overflow:hidden}body{flex-direction:column;display:flex}#controls{flex-wrap:wrap;align-items:center;gap:.5rem .75rem;padding:.5rem .75rem;display:flex}#controls label{align-items:center;gap:.5rem;display:flex}#chart{flex:auto;min-height:0}</style>
		<script type="module" crossorigin src="./assets/main-Cqtkoju3.js"></script>
	</head>
	<body>
		<div id="controls">
			<label>
				Text
				<input id="text" type="text" value="Anchored Text" size="18" />
			</label>
			<label>
				Horizontal
				<select id="horz-align">
					<option value="left">left</option>
					<option value="center" selected>center</option>
					<option value="right">right</option>
				</select>
			</label>
			<label>
				Vertical
				<select id="vert-align">
					<option value="top">top</option>
					<option value="center" selected>center</option>
					<option value="bottom">bottom</option>
				</select>
			</label>
			<label>
				Horizontal margin
				<input id="horz-margin" type="range" min="0" max="100" step="1" value="20" />
			</label>
			<label>
				Vertical margin
				<input id="vert-margin" type="range" min="0" max="100" step="1" value="10" />
			</label>
			<label>
				Font
				<select id="font">
					<option value="bold 14px -apple-system, BlinkMacSystemFont, 'Trebuchet MS', Roboto, Ubuntu, sans-serif">bold 14px sans-serif</option>
					<option value="italic bold 42px Arial" selected>italic bold 42px Arial</option>
					<option value="12px monospace">12px monospace</option>
				</select>
			</label>
			<label>
				Color
				<input id="color" type="color" value="#222222" />
			</label>
			<label>
				Layer
				<select id="z-order">
					<option value="top">top</option>
					<option value="normal" selected>normal</option>
					<option value="bottom">bottom</option>
				</select>
			</label>
			<label>
				<input id="visible" type="checkbox" checked />
				Visible
			</label>
			<label>
				<input id="left-scale" type="checkbox" />
				Left price scale
			</label>
			<label>
				<input id="second-pane" type="checkbox" />
				Second pane
			</label>
			<button id="attach" type="button">Detach</button>
		</div>
		<div id="chart"></div>
	</body>
</html>
