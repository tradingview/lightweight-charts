<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Heatmap series Plugin Example</title>
		<style>html,body{color:#131722;background-color:#f8f9fd;height:100%;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;overflow:hidden}#chart{width:100%;height:100%}#controls{z-index:10;background-color:#ffffffe6;border-radius:6px;flex-wrap:wrap;align-items:center;gap:12px;padding:8px 12px;font-size:13px;display:flex;position:absolute;top:12px;left:12px;box-shadow:0 1px 4px #13172233}#controls label{align-items:center;gap:6px;display:flex}#hovered{min-width:9em}</style>
		<script type="module" crossorigin src="./assets/main-BLeFYERA.js"></script>
	</head>
	<body>
		<div id="controls">
			<label>
				Data
				<select id="data">
					<option value="profile">volume profile</option>
					<option value="book">order book</option>
				</select>
			</label>
			<label>
				Colors
				<select id="shader">
					<option value="turbo">turbo scale</option>
					<option value="green">default green</option>
					<option value="purple">translucent purple</option>
				</select>
			</label>
			<label>
				Gap
				<select id="gap">
					<option value="0">none</option>
					<option value="1">1 px</option>
					<option value="2">2 px</option>
				</select>
			</label>
			<label>
				Border
				<select id="border">
					<option value="0">none</option>
					<option value="1 #FFFFFF">1 px white</option>
					<option value="1 #131722">1 px dark</option>
				</select>
			</label>
			<span id="hovered"></span>
		</div>
		<div id="chart"></div>
	</body>
</html>
