<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Scatter series Plugin Example</title>
		<style>:root{--text:#131722;--muted:#6a6d78;--card:#fff;--border:#e0e3eb}html,body{color:var(--text);background-color:#f8f9fd;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;font-size:14px}main{max-width:1440px;margin:0 auto;padding:24px 32px 64px}h1{margin:0 0 4px;font-size:24px}h2{margin:40px 0 4px;font-size:20px}main>p,section>p{color:var(--muted);max-width:900px;margin:4px 0 0}.toolbar{z-index:10;border-bottom:1px solid var(--border);background:#f8f9fdf2;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:16px -12px 0;padding:10px 12px;font-size:13px;display:flex;position:sticky;top:0}.toolbar label{cursor:pointer;font-weight:600}.toolbar .hint{color:var(--muted)}.grid{grid-template-columns:repeat(auto-fill,minmax(560px,1fr));gap:24px;margin-top:16px;display:grid}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;min-width:0;padding:20px 24px 16px}.card.wide{grid-column:1/-1}.card.narrow{box-sizing:content-box;width:300px;padding:20px 16px 16px}.card h3{margin:0;font-size:17px;font-weight:600}.card .description{color:var(--text);margin:4px 0 12px}.chart{height:320px;position:relative}.legend{color:var(--muted);flex-wrap:wrap;justify-content:center;gap:4px 16px;margin-top:10px;font-size:13px;display:flex}.legend button{color:inherit;font:inherit;cursor:pointer;background:0 0;border:0;align-items:center;gap:6px;padding:2px 4px;display:inline-flex}.legend button.off{opacity:.4}.legend .marker{border-radius:50%;width:8px;height:8px;display:inline-block}.legend .marker.square{border-radius:0}.legend .marker.diamond{border-radius:0;transform:rotate(45deg)scale(.85)}.legend .marker.triangleUp{clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:0}.legend .marker.triangleDown{clip-path:polygon(0 0,100% 0,50% 100%);border-radius:0}.legend .marker.hollow{box-sizing:border-box;background:0 0}.bubble-legend{color:var(--muted);justify-content:center;align-items:flex-end;gap:16px;margin-top:8px;font-size:12px;display:flex}.bubble-legend .item{flex-direction:column;align-items:center;gap:4px;display:inline-flex}.bubble-legend .bubble{box-sizing:border-box;background:#6a6d7826;border:1px solid #6a6d78cc;border-radius:50%;display:inline-block}.bubble-legend .caption{align-self:center}.readout{color:var(--muted);white-space:nowrap;text-overflow:ellipsis;min-height:1.4em;margin-top:8px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;overflow:hidden}.controls{flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:8px;font-size:13px;display:flex}.controls input[type=number]{width:56px}.rows{flex-wrap:wrap;gap:6px;margin-top:8px;font-size:12px;display:flex}.rows span{border:1px solid var(--border);cursor:default;border-radius:10px;padding:2px 8px}.rows span:hover{background:#2962ff14}</style>
		<script type="module" crossorigin src="./assets/main-C5HLAIRN.js"></script>
	</head>
	<body>
		<main id="app">
			<h1>Scatter series</h1>
			<p>
				Scenarios of the scatter chart design. Titles, descriptions,
				legends and the hovered readout are page markup, as a host would
				render them; the plugin draws the chart content only and has no
				tooltip.
			</p>
		</main>
	</body>
</html>
