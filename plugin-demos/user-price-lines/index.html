<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>User price lines Plugin Example</title>
		<style>html,body{color:#131722;background-color:#f8f9fd;height:100%;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;overflow:hidden}#chart{width:100%;height:100%}#controls{z-index:10;background-color:#ffffffe6;border-radius:6px;flex-wrap:wrap;align-items:center;gap:12px;padding:8px 12px;font-size:13px;display:flex;position:absolute;top:12px;left:12px;box-shadow:0 1px 4px #13172233}#controls label{align-items:center;gap:6px;display:flex}#hint{color:#13172299}#status{min-width:12em}</style>
		<script type="module" crossorigin src="./assets/main-O7x-bjA-.js"></script>
	</head>
	<body>
		<div id="controls">
			<label>
				Max lines
				<select id="max-lines">
					<option value="Infinity">no limit</option>
					<option value="1">1</option>
					<option value="3">3</option>
				</select>
			</label>
			<label>
				<input id="crosshair" type="checkbox" checked />
				Set crosshair mode
			</label>
			<button id="remove" type="button">Remove all</button>
			<span id="hint">Move the pointer to the right edge of the chart and click the ⊕ button to add a line.</span>
			<span id="status"></span>
		</div>
		<div id="chart"></div>
	</body>
</html>
