<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Grouped bars series Plugin Example</title>
		<style>html,body{color:#131722;background-color:#f8f9fd;height:100%;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;overflow:hidden}#chart{width:100%;height:100%}#controls{z-index:10;background-color:#ffffffe6;border-radius:6px;flex-wrap:wrap;align-items:center;gap:12px;padding:8px 12px;font-size:13px;display:flex;position:absolute;top:12px;left:12px;box-shadow:0 1px 4px #13172233}#controls label{align-items:center;gap:6px;display:flex}#hovered{min-width:9em}</style>
		<script type="module" crossorigin src="./assets/main-9fAI5BLW.js"></script>
	</head>
	<body>
		<div id="controls">
			<label>
				Columns
				<select id="groups">
					<option value="2">2</option>
					<option value="3" selected>3</option>
					<option value="4">4</option>
				</select>
			</label>
			<label>
				Width
				<select id="width-mode">
					<option value="percent" selected>percent</option>
					<option value="histogram">histogram</option>
				</select>
				<input id="width-percent" type="range" min="10" max="100" step="5" value="80" />
			</label>
			<label>
				Base
				<input id="base" type="range" min="0" max="30" step="1" value="0" />
			</label>
			<span id="hovered"></span>
		</div>
		<div id="chart"></div>
	</body>
</html>
