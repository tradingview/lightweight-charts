<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Brushable area series Plugin Example</title>
		<style>html,body{color:#131722;background-color:#f8f9fd;height:100%;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Trebuchet MS,Roboto,Ubuntu,sans-serif;overflow:hidden}body{flex-direction:column;display:flex}#controls{flex-wrap:wrap;align-items:center;gap:16px;padding:8px 12px;font-size:13px;display:flex}#controls label{align-items:center;gap:6px;display:inline-flex}#chart{flex:auto;min-height:0}</style>
		<script type="module" crossorigin src="./assets/main-amyw4FfK.js"></script>
	</head>
	<body>
		<div id="controls">
			<label
				>Brush style
				<select id="brush-style">
					<option value="green" selected>Green</option>
					<option value="orange">Orange</option>
					<option value="red">Red</option>
				</select>
			</label>
			<label
				>Line style
				<select id="line-style">
					<option value="0" selected>Solid</option>
					<option value="1">Dotted</option>
					<option value="2">Dashed</option>
					<option value="3">Large dashed</option>
					<option value="4">Sparse dotted</option>
				</select>
			</label>
			<label
				>Base price
				<input id="base-price" type="range" min="0" max="600" step="10" value="0" />
				<span id="base-price-value">0</span>
			</label>
		</div>
		<div id="chart"></div>
	</body>
</html>
