<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Vertical line Plugin Example</title>
		<style>html,body{color:#131722;background-color:#f8f9fd;height:100%;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Trebuchet MS,Roboto,Ubuntu,sans-serif;overflow:hidden}body{flex-direction:column;display:flex}#controls{flex-wrap:wrap;align-items:center;gap:16px;padding:8px 12px;font-size:13px;display:flex}#controls label{align-items:center;gap:6px;display:inline-flex}#chart{flex:auto;min-height:0}</style>
		<script type="module" crossorigin src="./assets/main-B8mnv9L5.js"></script>
	</head>
	<body>
		<div id="controls">
			<label
				>Line style
				<select id="line-style">
					<option value="0">Solid</option>
					<option value="1">Dotted</option>
					<option value="2" selected>Dashed</option>
					<option value="3">Large dashed</option>
					<option value="4">Sparse dotted</option>
				</select>
			</label>
			<label
				>Snap
				<select id="snap">
					<option value="exact">exact</option>
					<option value="nearest" selected>nearest</option>
				</select>
			</label>
			<label
				>Label
				<select id="label">
					<option value="none">hidden</option>
					<option value="time" selected>chart time format</option>
					<option value="text">custom text</option>
				</select>
			</label>
			<label
				><input id="draggable" type="checkbox" checked /> Draggable (green
				line)</label
			>
		</div>
		<div id="chart"></div>
	</body>
</html>
