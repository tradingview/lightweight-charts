<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Lightweight Charts - StackedArea Series Plugin Example</title>
		<link href="../../../examples-base.css" rel="stylesheet" />
		<style>
			#controls {
				display: flex;
				flex-wrap: wrap;
				gap: 16px;
				align-items: center;
				margin-block: 12px;
				font-size: 14px;
			}
			#controls label {
				display: flex;
				gap: 6px;
				align-items: center;
			}
		</style>
	</head>
	<body>
		<div id="chart"></div>
		<div class="column" id="controls">
			<label>
				Line type
				<select id="line-type">
					<option value="simple">simple</option>
					<option value="step">step</option>
					<option value="curved">curved</option>
				</select>
			</label>
			<label>
				Gaps
				<select id="gap-handling">
					<option value="break">break</option>
					<option value="bridge">bridge</option>
				</select>
			</label>
			<label>
				<input id="percent-mode" type="checkbox" />
				100% stacked
			</label>
		</div>
		<div id="description">
			<h1>Stacked Area Series</h1>
			<p>
				Multiple filled areas stacked on top of each other, representing the
				proportion of each variable at different points along the axis.
			</p>
			<p class="hint-message">
				The data has a whitespace gap and a stretch where the second band is
				negative, so that band is drawn back down towards the base.
			</p>
		</div>
		<script type="module" src="./example.ts"></script>
	</body>
</html>
