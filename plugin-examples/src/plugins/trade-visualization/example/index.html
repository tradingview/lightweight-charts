<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Lightweight Charts - Trade Visualization Plugin Example</title>
		<link href="../../../examples-base.css" rel="stylesheet" />
	</head>
	<body>
		<div id="chart"></div>
		<div id="description">
			<h1>Trade Visualization</h1>
			<p>
				A series primitive for plotting backtest trades. Each box spans the
				trade's entry and exit times and its target and stop prices. The box
				shows the outcome, while the diagonal line shows the trade direction.
			</p>
		</div>
		<script type="module" src="./example.ts"></script>
	</body>
</html>
