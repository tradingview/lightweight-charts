<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Lightweight Charts - Rounded Candles Series Example</title>
		<link href="../../../examples-base.css" rel="stylesheet" />
		<style>
			#controls {
				display: flex;
				flex-wrap: wrap;
				gap: 16px;
				align-items: center;
				padding-block: 12px;
				font-size: 13px;
			}
			#controls label {
				display: inline-flex;
				gap: 6px;
				align-items: center;
			}
		</style>
	</head>
	<body>
		<div id="chart"></div>
		<div class="column" id="controls">
			<label
				>Radius
				<select id="radius">
					<option value="auto" selected>Auto (bar spacing)</option>
					<option value="0">0 — square</option>
					<option value="4">4</option>
					<option value="10">10</option>
				</select>
			</label>
			<label
				>Wicks
				<select id="wick">
					<option value="butt" selected>Square ends</option>
					<option value="round">Round ends</option>
					<option value="hidden">Hidden</option>
				</select>
			</label>
			<label
				>Borders
				<select id="border">
					<option value="matching" selected>Matching the body</option>
					<option value="contrast">Contrasting</option>
					<option value="none">None</option>
				</select>
			</label>
		</div>
		<div id="description">
			<h1>Rounded Candles Series</h1>
			<p>
				Candle series where at larger sizes the corners of the candle bodies are
				rounded. Every tenth candle carries per-point colour overrides, and the
				run of whitespace in the middle of the data leaves a gap.
			</p>
		</div>
		<script type="module" src="./example.ts"></script>
	</body>
</html>
