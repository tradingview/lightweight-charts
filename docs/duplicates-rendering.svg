<svg xmlns="http://www.w3.org/2000/svg" width="900" height="665" viewBox="0 0 900 665" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect x="0" y="0" width="900" height="665" fill="#ffffff" />
<text x="24" y="34" font-size="19" fill="#131722" text-anchor="start" font-weight="600">Duplicates in one series: what changes on screen</text>
<text x="24" y="56" font-size="12.5" fill="#5d606b" text-anchor="start" font-weight="normal">Same data in every panel: 12:00:00 = 100, 12:00:00 = 105 (duplicate), 12:00:01 = 103.</text>
<text x="24" y="74" font-size="12" fill="#5d606b" text-anchor="start" font-weight="normal">Candles sit at x = width - (baseIndex + rightOffset - index + 0.5) * barSpacing - 1, with barSpacing = 70px.</text>
<text x="24" y="116" font-size="14" fill="#131722" text-anchor="start" font-weight="600">BEFORE: both rows land on one index</text>
<text x="24" y="134" font-size="11.5" fill="#ef5350" text-anchor="start" font-weight="normal">The second row overwrote the first, so both are drawn at index 0.</text>
<line x1="24" y1="250" x2="440" y2="250" stroke="#d1d4dc" stroke-width="1" />
<line x1="150" y1="206.79999999999998" x2="150" y2="245.20000000000002" stroke="#26a69a" stroke-width="1.4" />
<rect x="141.0" y="214.0" width="18" height="24.0" fill="#26a69a" />
<line x1="150" y1="200.79999999999998" x2="150" y2="239.20000000000002" stroke="#ef5350" stroke-width="1.4" />
<rect x="141.0" y="208.0" width="18" height="24.0" fill="none" stroke="#ef5350" stroke-width="1.6" stroke-dasharray="4 3"/>
<line x1="220" y1="194.79999999999998" x2="220" y2="227.20000000000002" stroke="#26a69a" stroke-width="1.4" />
<rect x="211.0" y="202.0" width="18" height="18.0" fill="#26a69a" />
<text x="150" y="274" font-size="11" fill="#131722" text-anchor="middle" font-weight="normal" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">12:00:00</text>
<text x="220" y="274" font-size="11" fill="#131722" text-anchor="middle" font-weight="normal" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">12:00:01</text>
<text x="150" y="294" font-size="10.5" fill="#8a8f98" text-anchor="middle" font-weight="normal">index 0</text>
<text x="220" y="294" font-size="10.5" fill="#8a8f98" text-anchor="middle" font-weight="normal">index 1</text>
<text x="24" y="318" font-size="11" fill="#ef5350" text-anchor="start" font-weight="normal">dashed = the 105 bar, painted over by the 100 bar. It never appears.</text>
<text x="466" y="116" font-size="14" fill="#131722" text-anchor="start" font-weight="600">Five items sharing one timestamp</text>
<text x="466" y="134" font-size="11.5" fill="#5d606b" text-anchor="start" font-weight="normal">Each item gets a column; the timestamp is labelled once.</text>
<line x1="466" y1="250" x2="878" y2="250" stroke="#d1d4dc" stroke-width="1" />
<line x1="482" y1="212.79999999999998" x2="482" y2="245.20000000000002" stroke="#26a69a" stroke-width="1.4" />
<rect x="474.5" y="220.0" width="15" height="18.0" fill="#26a69a" />
<line x1="538" y1="212.79999999999998" x2="538" y2="239.20000000000002" stroke="#ef5350" stroke-width="1.4" />
<rect x="530.5" y="220.0" width="15" height="12.0" fill="#ef5350" />
<line x1="594" y1="194.79999999999998" x2="594" y2="239.20000000000002" stroke="#26a69a" stroke-width="1.4" />
<rect x="586.5" y="202.0" width="15" height="30.0" fill="#26a69a" />
<line x1="650" y1="194.79999999999998" x2="650" y2="221.20000000000002" stroke="#ef5350" stroke-width="1.4" />
<rect x="642.5" y="202.0" width="15" height="12.0" fill="#ef5350" />
<line x1="706" y1="182.79999999999998" x2="706" y2="221.20000000000002" stroke="#26a69a" stroke-width="1.4" />
<rect x="698.5" y="190.0" width="15" height="24.0" fill="#26a69a" />
<line x1="782" y1="182.79999999999998" x2="782" y2="215.20000000000002" stroke="#ef5350" stroke-width="1.4" />
<rect x="774.5" y="190.0" width="15" height="18.0" fill="#ef5350" />
<text x="482" y="274" font-size="11" fill="#131722" text-anchor="middle" font-weight="normal" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">12:00:00</text>
<text x="782" y="274" font-size="11" fill="#131722" text-anchor="middle" font-weight="normal" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">12:00:01</text>
<path d="M470 282 L470 292 L718 292 L718 282" fill="none" stroke="#8a8f98" stroke-width="1"/>
<text x="594" y="308" font-size="10.5" fill="#8a8f98" text-anchor="middle" font-weight="normal">5 slots, indexes 0..4  ->  one label</text>
<text x="782" y="308" font-size="10.5" fill="#8a8f98" text-anchor="middle" font-weight="normal">index 5</text>
<text x="24" y="352" font-size="14" fill="#131722" text-anchor="start" font-weight="600">AFTER: one slot per data item</text>
<text x="24" y="370" font-size="11.5" fill="#26a69a" text-anchor="start" font-weight="normal">Indexes 0, 1, 2 - three evenly spaced candlesticks, nothing merged.</text>
<line x1="24" y1="486" x2="440" y2="486" stroke="#d1d4dc" stroke-width="1" />
<line x1="150" y1="442.79999999999995" x2="150" y2="481.20000000000005" stroke="#26a69a" stroke-width="1.4" />
<rect x="141.0" y="450.0" width="18" height="24.0" fill="#26a69a" />
<line x1="220" y1="436.79999999999995" x2="220" y2="475.20000000000005" stroke="#ef5350" stroke-width="1.4" />
<rect x="211.0" y="444.0" width="18" height="24.0" fill="#ef5350" />
<line x1="290" y1="430.79999999999995" x2="290" y2="463.20000000000005" stroke="#26a69a" stroke-width="1.4" />
<rect x="281.0" y="438.0" width="18" height="18.0" fill="#26a69a" />
<text x="150" y="510" font-size="11" fill="#131722" text-anchor="middle" font-weight="normal" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">12:00:00</text>
<text x="220" y="510" font-size="11" fill="#c4c8d0" text-anchor="middle" font-weight="normal" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">12:00:00</text>
<text x="290" y="510" font-size="11" fill="#131722" text-anchor="middle" font-weight="normal" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">12:00:01</text>
<line x1="196" y1="505" x2="244" y2="505" stroke="#c4c8d0" stroke-width="1" />
<text x="150" y="530" font-size="10.5" fill="#8a8f98" text-anchor="middle" font-weight="normal">index 0</text>
<text x="220" y="530" font-size="10.5" fill="#8a8f98" text-anchor="middle" font-weight="normal">index 1</text>
<text x="290" y="530" font-size="10.5" fill="#8a8f98" text-anchor="middle" font-weight="normal">index 2</text>
<text x="24" y="554" font-size="11" fill="#8a8f98" text-anchor="start" font-weight="normal">grey + struck through = duplicate label suppressed to keep the axis readable.</text>
<text x="466" y="352" font-size="14" fill="#131722" text-anchor="start" font-weight="600">Two series on the same chart</text>
<text x="466" y="370" font-size="11.5" fill="#5d606b" text-anchor="start" font-weight="normal">A: 3 ticks at 12:00:00 + 1 at 12:00:01.  B: 1 bar/sec.</text>
<line x1="466" y1="486" x2="878" y2="486" stroke="#d1d4dc" stroke-width="1" />
<rect x="475" y="398" width="14" height="34" fill="#26a69a" />
<rect x="531" y="398" width="14" height="34" fill="#26a69a" />
<rect x="587" y="398" width="14" height="34" fill="#26a69a" />
<rect x="643" y="398" width="14" height="34" fill="#26a69a" />
<rect x="475" y="442" width="14" height="24" fill="#2962ff" />
<rect x="643" y="442" width="14" height="24" fill="#2962ff" />
<text x="674" y="422" font-size="11" fill="#26a69a" text-anchor="start" font-weight="normal">series A</text>
<text x="674" y="460" font-size="11" fill="#2962ff" text-anchor="start" font-weight="normal">series B</text>
<text x="482" y="510" font-size="11" fill="#131722" text-anchor="middle" font-weight="normal" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">12:00:00</text>
<text x="650" y="510" font-size="11" fill="#131722" text-anchor="middle" font-weight="normal" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">12:00:01</text>
<text x="482" y="530" font-size="10.5" fill="#8a8f98" text-anchor="middle" font-weight="normal">index 0</text>
<text x="650" y="530" font-size="10.5" fill="#8a8f98" text-anchor="middle" font-weight="normal">index 3</text>
<text x="466" y="554" font-size="11" fill="#8a8f98" text-anchor="start" font-weight="normal">B has no data at indexes 1-2: it joins slot 0, the first tick.</text>
<text x="24" y="643" font-size="10.5" fill="#8a8f98" text-anchor="start" font-weight="normal">teal = up candle, red = down candle, dashed outline = a bar which is not drawn.</text>
</svg>