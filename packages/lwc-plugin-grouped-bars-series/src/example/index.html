<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Grouped bars series Plugin Example</title>
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				height: 100%;
				overflow: hidden;
				background-color: rgba(248, 249, 253, 1);
				color: rgba(19, 23, 34, 1);
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
					sans-serif;
			}
			#chart {
				width: 100%;
				height: 100%;
			}
			#controls {
				position: absolute;
				top: 12px;
				left: 12px;
				/* above the chart's own canvases, which sit at z-index 2 */
				z-index: 10;
				display: flex;
				flex-wrap: wrap;
				gap: 12px;
				align-items: center;
				padding: 8px 12px;
				border-radius: 6px;
				background-color: rgba(255, 255, 255, 0.9);
				box-shadow: 0 1px 4px rgba(19, 23, 34, 0.2);
				font-size: 13px;
			}
			#controls label {
				display: flex;
				gap: 6px;
				align-items: center;
			}
			#hovered {
				min-width: 9em;
			}
		</style>
	</head>
	<body>
		<div id="controls">
			<label>
				Columns
				<select id="groups">
					<option value="2">2</option>
					<option value="3" selected>3</option>
					<option value="4">4</option>
				</select>
			</label>
			<label>
				Width
				<select id="width-mode">
					<option value="percent" selected>percent</option>
					<option value="histogram">histogram</option>
				</select>
				<input id="width-percent" type="range" min="10" max="100" step="5" value="80" />
			</label>
			<label>
				Base
				<input id="base" type="range" min="0" max="30" step="1" value="0" />
			</label>
			<span id="hovered"></span>
		</div>
		<div id="chart"></div>
		<script type="module" src="./example.ts"></script>
	</body>
</html>
