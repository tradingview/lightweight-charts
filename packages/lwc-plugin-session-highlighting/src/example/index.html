<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Session highlighting Plugin Example</title>
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				height: 100%;
				overflow: hidden;
				background-color: rgba(248, 249, 253, 1);
				color: rgba(19, 23, 34, 1);
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
					sans-serif;
				font-size: 14px;
			}
			body {
				display: flex;
				flex-direction: column;
			}
			#controls {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 12px 16px;
				padding: 8px 12px;
			}
			#controls label {
				display: flex;
				align-items: center;
				gap: 6px;
			}
			#chart {
				flex: 1 1 auto;
				min-height: 0;
			}
		</style>
	</head>
	<body>
		<div id="controls">
			<label>
				Highlighter
				<select id="highlighter">
					<option value="weekends" selected>weekends</option>
					<option value="alternate">alternate days</option>
					<option value="month-start">first week of the month</option>
					<option value="none">nothing</option>
				</select>
			</label>
			<label>
				Layer
				<select id="z-order">
					<option value="bottom" selected>bottom</option>
					<option value="normal">normal</option>
					<option value="top">top</option>
				</select>
			</label>
			<label>
				Bar spacing
				<input id="bar-spacing" type="range" min="1" max="40" step="1" value="8" />
			</label>
			<label>
				<input id="visible" type="checkbox" checked />
				Visible
			</label>
			<label>
				<input id="left-scale" type="checkbox" />
				Left price scale
			</label>
			<label>
				<input id="second-pane" type="checkbox" />
				Second pane
			</label>
			<button id="append" type="button">Append a bar</button>
			<button id="attach" type="button">Detach</button>
		</div>
		<div id="chart"></div>
		<script type="module" src="./example.ts"></script>
	</body>
</html>
