<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Background shade series Plugin Example</title>
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				height: 100%;
				overflow: hidden;
				background-color: rgba(248, 249, 253, 1);
				color: rgba(19, 23, 34, 1);
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
					sans-serif;
			}
			#chart {
				width: 100%;
				height: 100%;
			}
			#controls {
				position: absolute;
				top: 12px;
				left: 12px;
				/* above the chart's own canvases, which sit at z-index 2 */
				z-index: 10;
				display: flex;
				flex-wrap: wrap;
				gap: 12px;
				align-items: center;
				padding: 8px 12px;
				border-radius: 6px;
				background-color: rgba(255, 255, 255, 0.9);
				box-shadow: 0 1px 4px rgba(19, 23, 34, 0.2);
				font-size: 13px;
			}
			#controls label {
				display: flex;
				gap: 6px;
				align-items: center;
			}
		</style>
	</head>
	<body>
		<div id="controls">
			<label>
				Colors
				<select id="colors">
					<option value="blue-red">blue → red</option>
					<option value="red-green">red → green</option>
					<option value="transparent-orange">transparent → orange</option>
				</select>
			</label>
			<label>
				Opacity
				<input id="opacity" type="range" min="0" max="1" step="0.05" value="0.3" />
			</label>
			<label>
				Range
				<select id="range">
					<option value="0-100">0–100</option>
					<option value="30-70">30–70</option>
				</select>
			</label>
		</div>
		<div id="chart"></div>
		<script type="module" src="./example.ts"></script>
	</body>
</html>
