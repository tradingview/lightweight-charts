<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Image watermark Plugin Example</title>
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				height: 100%;
				overflow: hidden;
				background-color: rgba(248, 249, 253, 1);
				color: rgba(19, 23, 34, 1);
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
					sans-serif;
				font-size: 14px;
			}
			body {
				display: flex;
				flex-direction: column;
			}
			#controls {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 16px;
				padding: 8px 12px;
			}
			#controls label {
				display: flex;
				align-items: center;
				gap: 6px;
			}
			#chart {
				flex: 1 1 auto;
				min-height: 0;
			}
		</style>
	</head>
	<body>
		<div id="controls">
			<label>
				Position
				<select id="position">
					<option value="center" selected>center</option>
					<option value="top-left">top-left</option>
					<option value="top-right">top-right</option>
					<option value="bottom-left">bottom-left</option>
					<option value="bottom-right">bottom-right</option>
				</select>
			</label>
			<label>
				Object fit
				<select id="object-fit">
					<option value="contain" selected>contain</option>
					<option value="cover">cover</option>
					<option value="none">none</option>
				</select>
			</label>
			<label>
				Alpha
				<input id="alpha" type="range" min="0" max="1" step="0.05" value="0.4" />
			</label>
			<label>
				<input id="left-scale" type="checkbox" />
				Left price scale
			</label>
			<label>
				<input id="second-pane" type="checkbox" />
				Second pane
			</label>
			<button id="attach" type="button">Detach</button>
		</div>
		<div id="chart"></div>
		<script type="module" src="./example.ts"></script>
	</body>
</html>
