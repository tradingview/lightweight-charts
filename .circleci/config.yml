# https://circleci.com/docs/2.0/configuration-reference

version: 2.1

parameters:
  run_branch_specific_graphics_tests:
    type: boolean
    default: false

aliases:
  - &restore-node-modules-cache
      name: Restore dependencies cache
      keys:
        - &cache-key v1-pnpm-deps-{{ checksum "pnpm-lock.yaml" }}-{{ checksum "pnpm-workspace.yaml" }}

  - &save-node-modules-cache
      name: Save dependencies cache
      # The whole workspace is installed with a single `pnpm install` at the
      # root, so one cache covers every project. All jobs run in the same
      # working directory, and pnpm's virtual store (node_modules/.pnpm) only
      # uses relative symlinks, so caching the materialized node_modules
      # trees is safe. Extend the paths when new packages/* projects appear.
      paths:
        - node_modules
        - website/node_modules
        - plugin-examples/node_modules
        - indicator-examples/node_modules
        - packages/create-lwc-plugin/node_modules
        - packages/lwc-toolkit/node_modules
        # puppeteer browser cache (see .puppeteerrc.cjs)
        - .cache
        # corepack-downloaded pnpm, so restore-only jobs don't re-download it
        - ~/.cache/node/corepack
      key: *cache-key

  - &default-filters
      tags:
        ignore:
          - /.*/

  - &merge-based-filters
      <<: *default-filters
      branches:
        ignore:
          - master
          - /release\/.*/


executors:
  node-executor:
    docker:
      - image: cimg/node:22.14.0
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

  node-browsers-executor:
    docker:
      - image: cimg/node:22.14.0-browsers
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

commands:
  checkout-with-deps:
    description: "Checkout the code, enable pnpm via corepack and restore the dependencies cache"
    steps:
      - checkout
      - run:
          name: Enable corepack (pnpm)
          command: sudo corepack enable
      - restore_cache: *restore-node-modules-cache

  run-graphics-tests:
    description: "Run graphics tests with specific devicePixelRatio"
    parameters:
      devicePixelRatio:
        type: string
      productionBuild:
        type: boolean
        default: false
      grep:
        type: string
      branchSpecificTest:
        type: boolean
        default: false
    steps:
      - checkout-with-deps
      - run:
          name: "Setup Environment Variables"
          command: |
            echo 'export NO_SANDBOX="true"' >> $BASH_ENV
            echo 'export CMP_OUT_DIR="./graphics-cmp-data"' >> $BASH_ENV
            echo 'export TESTS_REPORT_FILE="test-results/graphics/results.xml"' >> $BASH_ENV
            echo 'export DEVICE_PIXEL_RATIO=<< parameters.devicePixelRatio >>' >> $BASH_ENV
            echo 'export PRODUCTION_BUILD=<< parameters.productionBuild >>' >> $BASH_ENV
            echo 'export GREP="<< parameters.grep >>"' >> $BASH_ENV
            echo 'export COMPARE_BRANCH="master"' >> $BASH_ENV
            echo 'export BRANCH_SPECIFIC_TEST=<< parameters.branchSpecificTest >>' >> $BASH_ENV
      - run:
          command: scripts/run-graphics-tests.sh
          no_output_timeout: 5m

      - store_test_results:
          path: test-results/
      - store_artifacts:
          path: ./graphics-cmp-data
          when: on_fail


jobs:
  install-deps:
    executor: node-executor
    steps:
      - checkout-with-deps
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec puppeteer browsers install chrome
      - save_cache: *save-node-modules-cache

  build:
    executor: node-executor
    steps:
      - checkout-with-deps
      - run: pnpm build:prod
      # make sure that the project is compiled successfully with composite projects
      # so we don't have cyclic deps between projects and wrong imports
      - run: pnpm tsc-verify
      - persist_to_workspace:
          root: ./
          paths:
            - lib
            - dist

  no-crlf:
    executor: node-executor
    steps:
      - checkout
      - run: scripts/no-crlf.sh

  trailing-lf:
    executor: node-executor
    steps:
      - checkout
      - run: scripts/trailing-newlines.sh

  lint-eslint:
    executor: node-executor
    steps:
      - checkout-with-deps
      - attach_workspace:
          at: ./
      - run: pnpm lint:eslint

  lint-dts:
    executor: node-executor
    steps:
      - checkout-with-deps
      - attach_workspace:
          at: ./
      - run: pnpm bundle-dts
      - run: pnpm check-dts-docs

  lint-markdown:
    executor: node-executor
    steps:
      - checkout-with-deps
      - run: pnpm lint:md

  lwc-toolkit:
    executor: node-executor
    steps:
      - checkout-with-deps
      - run: pnpm --filter @tradingview/lwc-toolkit typecheck
      - run: pnpm --filter @tradingview/lwc-toolkit build
      # Neither tsc nor Vite minds an extensionless relative specifier, so
      # nothing else in the repo would notice the package emitting ESM that real
      # Node cannot resolve. Import every sub-path by specifier, from a
      # workspace that depends on the package, so the exports map is exercised
      # the way a consumer without a bundler would.
      - run:
          name: "Check every sub-path could be imported in NodeJS"
          command: |
            cd plugin-examples
            node --input-type=module -e "
              const { createRequire } = await import('node:module');
              const require = createRequire('$PWD/package.json');
              const pkg = require('@tradingview/lwc-toolkit/package.json');
              const subs = Object.keys(pkg.exports).filter((k) => k !== './package.json');
              for (const sub of subs) {
                await import('@tradingview/lwc-toolkit/' + sub.slice(2));
              }
              console.log('resolved ' + subs.length + ' sub-paths');
            "
      - run:
          name: "Lint the publishable package"
          command: |
            cd packages/lwc-toolkit
            pnpm dlx publint@0.3.14 --strict
            # node10 ignores `exports` altogether and a `require` of an ESM-only
            # package is meant to fail, so both are by design here rather than
            # findings. `node16 (from ESM)` and `bundler` are the modes that
            # have to stay green.
            pnpm dlx @arethetypeswrong/cli@0.18.5 --pack . \
              --ignore-rules no-resolution cjs-resolves-to-esm

  usable-in-nodejs:
    executor: node-executor
    steps:
      - checkout-with-deps
      - attach_workspace:
          at: ./
      - run: pnpm prepare-package-json-for-release
      - run:
          name: "Installing lightweight-charts package into node_modules"
          # this is hacky way to do something like `npm link lightweight-charts`
          # but we cannot use `npm link` in CI
          command: |
            cd node_modules
            ln -s ../ lightweight-charts
      - run:
          name: "Check ESM could be imported in NodeJS"
          command: node -e "import 'lightweight-charts'" --input-type=module

  unittests:
    executor: node-executor
    environment:
      TESTS_REPORT_FILE: "test-results/unittests/results.xml"
    steps:
      - checkout-with-deps
      - run: pnpm test
      - store_test_results:
          path: test-results/

  type-tests:
    executor: node-executor
    steps:
      - checkout-with-deps
      - run: pnpm type-tests

  dts-changes:
    executor: node-executor
    steps:
      - checkout-with-deps
      - run: scripts/check-dts-changes.sh ./dts-changes $(git merge-base origin/master HEAD) $(git rev-parse HEAD)
      - store_artifacts:
          path: ./dts-changes
          when: on_fail

  graphics-tests:
    parameters:
      grep:
        type: string
      dpr:
        type: string
      productionBuild:
        type: boolean
        default: false
      branchSpecificTest:
        type: boolean
        default: false
    executor: node-browsers-executor
    steps:
      - run-graphics-tests:
          devicePixelRatio: << parameters.dpr >>
          grep: << parameters.grep >>
          productionBuild: << parameters.productionBuild >>
          branchSpecificTest: << parameters.branchSpecificTest >>

  memleaks-tests:
    executor: node-browsers-executor
    environment:
      NO_SANDBOX: "true"
      TESTS_REPORT_FILE: "test-results/memleaks/results.xml"
      RUNNING_ON_CI: "true"
    steps:
      - checkout-with-deps
      - attach_workspace:
          at: ./
      # install the required libraries for chrome version used by memlab
      - run: sudo apt-get update
      - run: sudo apt-get install ca-certificates fonts-liberation libasound2 libatk-bridge2.0-0 libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgbm1 libgcc1 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 lsb-release wget xdg-utils
      - run: sleep 5
      - run: scripts/run-memleaks-tests.sh
      - store_test_results:
          path: test-results/
      - store_artifacts:
          path: tests/e2e/memleaks/.logs/

  coverage:
    executor: node-browsers-executor
    environment:
      NO_SANDBOX: "true"
      TESTS_REPORT_FILE: "test-results/coverage/results.xml"
    steps:
      - checkout-with-deps
      - attach_workspace:
          at: ./
      - run: scripts/run-coverage-tests.sh
      - store_test_results:
          path: test-results/

  interactions:
    executor: node-browsers-executor
    environment:
      NO_SANDBOX: "true"
      TESTS_REPORT_FILE: "test-results/interactions/results.xml"
    steps:
      - checkout-with-deps
      - attach_workspace:
          at: ./
      - run: scripts/run-interactions-tests.sh
      - store_test_results:
          path: test-results/

  size-limit:
    executor: node-executor
    steps:
      - checkout-with-deps
      - attach_workspace:
          at: ./
      - run:
          command: echo 'export COMPARE_BRANCH="master"' >> $BASH_ENV
      - run:
          name: "Comparing sizes with merge-base"
          command: node scripts/compare-size-with-merge-base.js
      - run: pnpm size-limit

  build-plugin-examples:
    executor: node-executor
    steps:
      - checkout-with-deps
      - attach_workspace:
          at: ./
      # builds @tradingview/lwc-toolkit first (via the build:utils pre-step),
      # typechecks all plugin sources against it and compiles every plugin,
      # including the bundled typings that must inline the toolkit
      - run:
          command: pnpm --filter lightweight-charts-plugin-examples compile
          no_output_timeout: 5m

  build-docusaurus-website:
    executor: node-executor
    resource_class: medium+
    steps:
      - checkout-with-deps
      - run: pnpm build:prod
      - run:
          name: "Build website"
          command: |
            cd website
            pnpm build
      - run:
          # we need to run this check here because only here we have generated md files of the website
          name: "Check website markdown links"
          command: pnpm check-markdown-links --check-website-links
      - persist_to_workspace:
          root: ./
          paths:
            - website


anchors:
  - &graphics-test-matrix
    parameters:
      dpr: ["1.0", "1.25", "1.5", "2.0"]
      productionBuild: [false, true]
    exclude:
      - dpr: "1.0"
        productionBuild: true
      - dpr: "1.25"
        productionBuild: true
      - dpr: "1.5"
        productionBuild: true

  - &graphics-test-config
    requires:
      - build
    filters: *merge-based-filters
    dpr: << matrix.dpr >>
    productionBuild: << matrix.productionBuild >>


workflows:
  version: 2

  branch-specific-graphics-tests:
    when: << pipeline.parameters.run_branch_specific_graphics_tests >>
    jobs:
      - install-deps:
          filters: *default-filters
      - build:
          filters: *default-filters
          requires:
            - install-deps

      - graphics-tests:
          name: branch_specific_graphics-tests-part1-dpr<< matrix.dpr >><<# matrix.productionBuild >>-PROD<</ matrix.productionBuild >>
          grep: "(api/|applying-options/|series-markers/|price-scale/)"
          branchSpecificTest: true
          matrix: *graphics-test-matrix
          <<: *graphics-test-config
      - graphics-tests:
          name: branch_specific_graphics-tests-part2-dpr<< matrix.dpr >><<# matrix.productionBuild >>-PROD<</ matrix.productionBuild >>
          grep: "(initial-options/|logical-range/|panes/|plugins/|two-scales/|test-cases/)"
          branchSpecificTest: true
          matrix: *graphics-test-matrix
          <<: *graphics-test-config
      - graphics-tests:
          name: branch_specific_graphics-tests-part3-dpr<< matrix.dpr >><<# matrix.productionBuild >>-PROD<</ matrix.productionBuild >>
          grep: "(series/|time-scale/|degenerative-horizontal-series-with-integer-min-tick/)"
          branchSpecificTest: true
          matrix: *graphics-test-matrix
          <<: *graphics-test-config

  build-lint-test:
    when:
      not: << pipeline.parameters.run_branch_specific_graphics_tests >>
    jobs:
      - install-deps:
          filters: *default-filters
      - no-crlf:
          filters: *default-filters
      - trailing-lf:
          filters: *default-filters

      - build:
          filters: *default-filters
          requires:
            - install-deps
      - lint-markdown:
          filters: *default-filters
          requires:
            - install-deps
      - lwc-toolkit:
          filters: *default-filters
          requires:
            - install-deps

      - size-limit:
          filters: *default-filters
          requires:
            - build
      - usable-in-nodejs:
          filters: *default-filters
          requires:
            - build
      - unittests:
          filters: *default-filters
          requires:
            - build
      - type-tests:
          filters: *default-filters
          requires:
            - build
      - dts-changes:
          filters: *merge-based-filters
          requires:
            - build
      - graphics-tests:
          name: graphics-tests-part1-dpr<< matrix.dpr >><<# matrix.productionBuild >>-PROD<</ matrix.productionBuild >>
          grep: "(api/|applying-options/|series-markers/|price-scale/)"
          matrix: *graphics-test-matrix
          <<: *graphics-test-config
      - graphics-tests:
          name: graphics-tests-part2-dpr<< matrix.dpr >><<# matrix.productionBuild >>-PROD<</ matrix.productionBuild >>
          grep: "(initial-options/|logical-range/|panes/|plugins/|two-scales/|test-cases/)"
          matrix: *graphics-test-matrix
          <<: *graphics-test-config
      - graphics-tests:
          name: graphics-tests-part3-dpr<< matrix.dpr >><<# matrix.productionBuild >>-PROD<</ matrix.productionBuild >>
          grep: "(series/|time-scale/|degenerative-horizontal-series-with-integer-min-tick/)"
          matrix: *graphics-test-matrix
          <<: *graphics-test-config
      - memleaks-tests:
          filters: *default-filters
          requires:
            - build
      - coverage:
          filters: *default-filters
          requires:
            - build
      - interactions:
          filters: *default-filters
          requires:
            - build
      - lint-dts:
          filters: *default-filters
          requires:
            - build
      - lint-eslint:
          filters: *default-filters
          requires:
            - build
      - build-plugin-examples:
          filters: *default-filters
          requires:
            - build
      - build-docusaurus-website:
          filters: *default-filters
          requires:
            - install-deps
