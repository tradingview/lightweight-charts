name: Documentation Website Deployment

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/deploy.yml'
      - 'src/**'
      - 'website/**'
      - 'plugin-examples/src/**'
      - 'indicator-examples/src/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

jobs:
  deploy:
    runs-on: ubuntu-22.04
    if: ${{ github.ref == 'refs/heads/master' }}
    permissions:
      contents: write
      pages: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # pnpm (exact version from the root package.json `packageManager` field)
      # is provided by corepack, which ships with Node.js <= 24. When the
      # runners' default Node.js moves past 24 (corepack is removed in
      # Node 25+), switch to a SHA-pinned pnpm/action-setup instead.
      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build library
        run: pnpm build:prod
      - name: Build documentation website
        run: pnpm --filter lightweight-charts-website build
      - name: Build plugin examples website
        run: pnpm --filter lightweight-charts-plugin-examples build:examples:site
      - name: Build indicator examples website
        run: pnpm --filter lightweight-charts-indicator-examples build:examples:site

      - name: Deploy
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4
        if: ${{ github.ref == 'refs/heads/master' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/build
          user_name: 'TradingView'
          user_email: 'noreply@tradingview.com'
          commit_message: '[skip ci] Deploy website on ${{ github.event.head_commit.id }}'
