name: "size"
on:
  pull_request:
    branches:
      - master
permissions:
  pull-requests: write
jobs:
  size:
    runs-on: ubuntu-latest
    env:
      CI_JOB_NUMBER: 1
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      # pnpm is provided by corepack (see the note in deploy.yml); the
      # size-limit action shells out to pnpm for install/build.
      # The action also installs and builds the PR's BASE branch in the same
      # working tree. A base revision may predate the root `packageManager`
      # field, in which case the corepack shim would fall back to the latest
      # pnpm (which fails hard on unreviewed dependency build scripts in CI),
      # so the project's pinned pnpm is installed as the shim's default.
      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack install -g "$(node -p 'require("./package.json").packageManager')"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: andresz1/size-limit-action@e7493a72a44b113341c0cf6186ab49c17c4b65c1 # v1.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_script: build:prod
